apiVersion: v1
kind: Pod
metadata:
  name: multi-container-basic
  labels:
    app: multi-container-demo
spec:
  containers:
  - name: web-server
    image: nginx:1.21
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
  - name: log-processor
    image: busybox:1.35
    command: ['sh', '-c']
    args:
    - |
      while true; do
        echo "Processing logs at $(date)" >> /var/log/app/processed.log
        if [ -f /var/log/nginx/access.log ]; then
          tail -n 5 /var/log/nginx/access.log >> /var/log/app/processed.log
        fi
        sleep 30
      done
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
    - name: processed-logs
      mountPath: /var/log/app
  volumes:
  - name: shared-logs
    emptyDir: {}
  - name: processed-logs
    emptyDir: {}
