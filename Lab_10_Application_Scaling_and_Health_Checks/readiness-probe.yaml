apiVersion: apps/v1
kind: Deployment
metadata:
  name: cakephp-app
spec:
  template:
    spec:
      containers:
      - name: cakephp-app
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
