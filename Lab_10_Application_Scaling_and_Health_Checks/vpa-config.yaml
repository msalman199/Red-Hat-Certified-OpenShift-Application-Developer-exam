apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cakephp-app-vpa
  namespace: scaling-lab
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cakephp-app
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: cakephp-app
      maxAllowed:
        cpu: 1
        memory: 1Gi
      minAllowed:
        cpu: 50m
        memory: 64Mi
