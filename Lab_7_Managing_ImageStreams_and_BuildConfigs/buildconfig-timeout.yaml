apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: nodejs-timeout-build
  labels:
    app: nodejs-timeout
spec:
  source:
    type: Git
    git:
      uri: https://github.com/sclorg/nodejs-ex.git
      ref: master
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: nodejs:16-ubi8
  output:
    to:
      kind: ImageStreamTag
      name: nodejs-timeout:latest
  completionDeadlineSeconds: 600  # 10 minutes
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 3
  triggers:
  - type: ConfigChange
