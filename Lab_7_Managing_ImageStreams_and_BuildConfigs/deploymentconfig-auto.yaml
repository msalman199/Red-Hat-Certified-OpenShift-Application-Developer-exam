apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: nodejs-auto-deploy
  labels:
    app: nodejs-auto
spec:
  replicas: 2
  selector:
    app: nodejs-auto
  template:
    metadata:
      labels:
        app: nodejs-auto
    spec:
      containers:
      - name: nodejs-app
        image: nodejs-sample:latest
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: production
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
  triggers:
  - type: ConfigChange
  - type: ImageChange
    imageChangeParams:
      automatic: true
      containerNames:
      - nodejs-app
      from:
        kind: ImageStreamTag
        name: nodejs-sample:latest
