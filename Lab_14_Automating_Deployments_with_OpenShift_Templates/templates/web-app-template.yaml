apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: web-app-template
  annotations:
    description: "Template for deploying a web application with configurable parameters"
    tags: "web,application,template"
    iconClass: "icon-nodejs"
labels:
  template: web-app-template
objects:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: ${APP_NAME}
    labels:
      app: ${APP_NAME}
      environment: ${ENVIRONMENT}
  spec:
    replicas: ${{REPLICA_COUNT}}
    selector:
      matchLabels:
        app: ${APP_NAME}
    template:
      metadata:
        labels:
          app: ${APP_NAME}
          environment: ${ENVIRONMENT}
      spec:
        containers:
        - name: ${APP_NAME}
          image: ${IMAGE_NAME}:${IMAGE_TAG}
          ports:
          - containerPort: ${{CONTAINER_PORT}}
          env:
          - name: ENVIRONMENT
            value: ${ENVIRONMENT}
          - name: DATABASE_URL
            value: ${DATABASE_URL}
          resources:
            requests:
              memory: ${MEMORY_REQUEST}
              cpu: ${CPU_REQUEST}
            limits:
              memory: ${MEMORY_LIMIT}
              cpu: ${CPU_LIMIT}
- apiVersion: v1
  kind: Service
  metadata:
    name: ${APP_NAME}-service
    labels:
      app: ${APP_NAME}
      environment: ${ENVIRONMENT}
  spec:
    selector:
      app: ${APP_NAME}
    ports:
    - port: ${{SERVICE_PORT}}
      targetPort: ${{CONTAINER_PORT}}
      protocol: TCP
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    name: ${APP_NAME}-route
    labels:
      app: ${APP_NAME}
      environment: ${ENVIRONMENT}
  spec:
    to:
      kind: Service
      name: ${APP_NAME}-service
    port:
      targetPort: ${{CONTAINER_PORT}}
parameters:
- name: APP_NAME
  description: "Name of the application"
  value: "my-web-app"
  required: true
- name: ENVIRONMENT
  description: "Deployment environment"
  value: "development"
  required: true
- name: IMAGE_NAME
  description: "Container image name"
  value: "nginx"
  required: true
- name: IMAGE_TAG
  description: "Container image tag"
  value: "latest"
  required: true
- name: REPLICA_COUNT
  description: "Number of replicas"
  value: "1"
  required: true
- name: CONTAINER_PORT
  description: "Container port"
  value: "8080"
  required: true
- name: SERVICE_PORT
  description: "Service port"
  value: "80"
  required: true
- name: DATABASE_URL
  description: "Database connection URL"
  value: "postgresql://localhost:5432/mydb"
  required: false
- name: MEMORY_REQUEST
  description: "Memory request"
  value: "128Mi"
  required: true
- name: MEMORY_LIMIT
  description: "Memory limit"
  value: "256Mi"
  required: true
- name: CPU_REQUEST
  description: "CPU request"
  value: "100m"
  required: true
- name: CPU_LIMIT
  description: "CPU limit"
  value: "200m"
  required: true
