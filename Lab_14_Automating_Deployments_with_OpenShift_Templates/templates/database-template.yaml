apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: postgresql-template
  annotations:
    description: "Template for deploying PostgreSQL database"
    tags: "database,postgresql,template"
    iconClass: "icon-postgresql"
labels:
  template: postgresql-template
objects:
- apiVersion: v1
  kind: Secret
  metadata:
    name: ${DATABASE_NAME}-secret
    labels:
      app: ${DATABASE_NAME}
      environment: ${ENVIRONMENT}
  stringData:
    database-user: ${POSTGRESQL_USER}
    database-password: ${POSTGRESQL_PASSWORD}
    database-name: ${POSTGRESQL_DATABASE}
- apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: ${DATABASE_NAME}-pvc
    labels:
      app: ${DATABASE_NAME}
      environment: ${ENVIRONMENT}
  spec:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: ${VOLUME_CAPACITY}
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: ${DATABASE_NAME}
    labels:
      app: ${DATABASE_NAME}
      environment: ${ENVIRONMENT}
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: ${DATABASE_NAME}
    template:
      metadata:
        labels:
          app: ${DATABASE_NAME}
          environment: ${ENVIRONMENT}
      spec:
        containers:
        - name: postgresql
          image: ${POSTGRESQL_IMAGE}:${POSTGRESQL_VERSION}
          ports:
          - containerPort: 5432
          env:
          - name: POSTGRESQL_USER
            valueFrom:
              secretKeyRef:
                name: ${DATABASE_NAME}-secret
                key: database-user
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ${DATABASE_NAME}-secret
                key: database-password
          - name: POSTGRESQL_DATABASE
            valueFrom:
              secretKeyRef:
                name: ${DATABASE_NAME}-secret
                key: database-name
          volumeMounts:
          - name: postgresql-data
            mountPath: /var/lib/pgsql/data
          resources:
            requests:
              memory: ${MEMORY_REQUEST}
              cpu: ${CPU_REQUEST}
            limits:
              memory: ${MEMORY_LIMIT}
              cpu: ${CPU_LIMIT}
        volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: ${DATABASE_NAME}-pvc
- apiVersion: v1
  kind: Service
  metadata:
    name: ${DATABASE_NAME}-service
    labels:
      app: ${DATABASE_NAME}
      environment: ${ENVIRONMENT}
  spec:
    selector:
      app: ${DATABASE_NAME}
    ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
parameters:
- name: DATABASE_NAME
  description: "Name of the database application"
  value: "postgresql"
  required: true
- name: ENVIRONMENT
  description: "Deployment environment"
  value: "development"
  required: true
- name: POSTGRESQL_IMAGE
  description: "PostgreSQL container image"
  value: "registry.redhat.io/rhel8/postgresql-13"
  required: true
- name: POSTGRESQL_VERSION
  description: "PostgreSQL version tag"
  value: "latest"
  required: true
- name: POSTGRESQL_USER
  description: "PostgreSQL user name"
  generate: expression
  from: "user[A-Z0-9]{3}"
  required: true
- name: POSTGRESQL_PASSWORD
  description: "PostgreSQL password"
  generate: expression
  from: "[a-zA-Z0-9]{16}"
  required: true
- name: POSTGRESQL_DATABASE
  description: "PostgreSQL database name"
  value: "sampledb"
  required: true
- name: VOLUME_CAPACITY
  description: "Volume space available for data"
  value: "1Gi"
  required: true
- name: MEMORY_REQUEST
  description: "Memory request"
  value: "256Mi"
  required: true
- name: MEMORY_LIMIT
  description: "Memory limit"
  value: "512Mi"
  required: true
- name: CPU_REQUEST
  description: "CPU request"
  value: "200m"
  required: true
- name: CPU_LIMIT
  description: "CPU limit"
  value: "500m"
  required: true
