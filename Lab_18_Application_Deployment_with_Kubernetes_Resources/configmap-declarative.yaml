apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  labels:
    app: webapp
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        location /api {
            proxy_pass http://backend:8080;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>My Web App</title>
    </head>
    <body>
        <h1>Welcome to My Kubernetes Web App</h1>
        <p>This page is served from a ConfigMap!</p>
    </body>
    </html>
